version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: skillsync_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: skillsync
      MONGO_INITDB_ROOT_PASSWORD: skillsync_dev_password
      MONGO_INITDB_DATABASE: skillsync_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: skillsync_redis
    restart: unless-stopped
    command: redis-server --requirepass skillsync_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "skillsync_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for local S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: skillsync_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: skillsync_minio
      MINIO_ROOT_PASSWORD: skillsync_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
  redis_data:
  minio_data:

networks:
  default:
    name: skillsync_network
